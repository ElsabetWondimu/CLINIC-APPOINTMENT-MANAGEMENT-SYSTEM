<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexCare Health — Clinical Appointment & Management Platform</title>
  
  <!-- Favicon Pulse Medical SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d9488' stroke-width='2.5'><path stroke-linecap='round' stroke-linejoin='round' d='M12 4v16m8-8H4'/></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e',
            },
            slate: {
              850: '#151e2e',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Styles, Glassmorphism & Print Stylesheet -->
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-200">
  
  <div class="min-h-full flex flex-col">
    <!-- Navbar Mount -->
    <div id="navbar-root"></div>

    <!-- Main App Body with Sidebar + Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto">
      <!-- Sidebar Mount -->
      <div id="sidebar-root" class="flex-shrink-0"></div>

      <!-- Main Content Dynamic View Mount -->
      <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
        <div id="main-content-root">
          <!-- Loading Skeleton -->
          <div class="animate-pulse space-y-6">
            <div class="h-44 rounded-3xl bg-slate-200 dark:bg-slate-800"></div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
              <div class="h-24 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
              <div class="h-24 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
              <div class="h-24 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
            </div>
            <div class="h-72 rounded-3xl bg-slate-200 dark:bg-slate-800"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modals Mount Point -->
  <div id="modals-root"></div>

  <!-- Toasts Mount Point -->
  <div id="toasts-root"></div>

  <!-- Hidden Container for Printable Appointment Pass -->
  <div id="printable-slip" class="hidden"></div>

  <!-- Application Module Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
